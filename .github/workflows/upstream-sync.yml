name: Upstream sync PR

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  BASE_BRANCH: main-staging
  COMPARE_BRANCH: main
  SYNC_BRANCH: automation/sync-upstream-main-staging
  UPSTREAM_REPO: dubinc/dub
  UPSTREAM_BRANCH: main

jobs:
  create-sync-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Check out fork
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check first Monday schedule
        id: schedule
        if: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail

          day_of_month="$(date -u +%d)"
          if [ "${day_of_month#0}" -gt 7 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "This is not the first Monday of the month; skipping PR creation and Slack notification."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create upstream merge branch
        id: sync
        if: ${{ github.event_name == 'workflow_dispatch' || steps.schedule.outputs.should_run == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch origin "${BASE_BRANCH}"
          git fetch origin "${COMPARE_BRANCH}"
          git fetch upstream "${UPSTREAM_BRANCH}"
          git fetch origin "${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}" || true

          read -r ahead behind < <(git rev-list --left-right --count "origin/${COMPARE_BRANCH}...upstream/${UPSTREAM_BRANCH}")
          echo "ahead=${ahead}" >> "$GITHUB_OUTPUT"
          echo "behind=${behind}" >> "$GITHUB_OUTPUT"

          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
          base_sha="$(git rev-parse "origin/${BASE_BRANCH}")"
          compare_sha="$(git rev-parse "origin/${COMPARE_BRANCH}")"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
          echo "compare_sha=${compare_sha}" >> "$GITHUB_OUTPUT"

          if [ "${behind}" = "0" ]; then
            echo "status=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git switch -C "${SYNC_BRANCH}" "origin/${BASE_BRANCH}"

          sync_status="created"
          conflict_files="None"

          if ! git merge --no-ff --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            sync_status="created_with_conflicts_resolved_to_upstream_tree"
            conflict_files="$(git diff --name-only --diff-filter=U | sed -n '1,80p')"

            # Keep upstream history, but resolve the sync branch to the
            # upstream tree so the sync PR does not introduce CFA custom code.
            # Preserve this workflow so future scheduled syncs continue to run.
            git read-tree --reset -u "upstream/${UPSTREAM_BRANCH}"

            if git cat-file -e "origin/${BASE_BRANCH}:.github/workflows/upstream-sync.yml" 2>/dev/null; then
              git restore \
                --source "origin/${BASE_BRANCH}" \
                --staged \
                --worktree \
                -- .github/workflows/upstream-sync.yml
            fi

            git commit --no-edit
          fi

          {
            echo "conflict_files<<EOF"
            printf '%s\n' "${conflict_files}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD

          git push --force-with-lease origin "HEAD:${SYNC_BRANCH}"

          existing_pr_url="$(
            gh pr list \
              --base "${BASE_BRANCH}" \
              --head "${SYNC_BRANCH}" \
              --state open \
              --json url \
              --jq '.[0].url // ""'
          )"

          body_file="$(mktemp)"
          {
            printf '%s\n\n' "This PR was created by the monthly upstream sync workflow."
            printf '%s\n' "It syncs \`${UPSTREAM_REPO}/${UPSTREAM_BRANCH}\` into \`${BASE_BRANCH}\` using a real merge so upstream commit history is preserved."
            printf '%s\n' "Behind/ahead counts are measured against \`${COMPARE_BRANCH}\`, because that is the production/default branch."
            printf '%s\n\n' "It does not auto-merge."
            printf '%s\n\n' "## Sync status"
            printf '%s\n' "- Fork commits ahead of upstream: ${ahead}"
            printf '%s\n' "- Upstream commits missing from the fork: ${behind}"
            printf '%s\n' "- Compare branch: \`${COMPARE_BRANCH}\` at \`${compare_sha}\`"
            printf '%s\n' "- Base branch: \`${BASE_BRANCH}\` at \`${base_sha}\`"
            printf '%s\n' "- Upstream branch: \`${UPSTREAM_REPO}/${UPSTREAM_BRANCH}\` at \`${upstream_sha}\`"
            printf '%s\n\n' "- Workflow result: \`${sync_status}\`"
            printf '%s\n\n' "## Merge conflicts"
            if [ "${sync_status}" = "created" ]; then
              printf '%s\n\n' "No merge conflicts were detected by the workflow."
            else
              printf '%s\n\n' "Merge conflicts were detected. To keep this PR upstream-clean, the workflow preserved merge ancestry and resolved the sync branch to the upstream tree, while keeping this workflow file."
              printf '%s\n\n' "Conflicted files:"
              printf '```text\n%s\n```\n\n' "${conflict_files}"
            fi
            printf '%s\n\n' "## Review and merge process"
            printf '%s\n' "1. Confirm this PR contains upstream commits only; CFA-specific changes should go in a separate PR."
            printf '%s\n' "2. Merge this PR into \`${BASE_BRANCH}\` with a merge commit. Do not squash or rebase it, otherwise the upstream history will not be preserved."
            printf '%s\n' "3. Test the staging branch after merge."
            printf '%s\n' "4. Promote \`${BASE_BRANCH}\` to \`main\` only after staging looks good."
          } > "${body_file}"

          if [ -n "${existing_pr_url}" ]; then
            pr_url="${existing_pr_url}"
            gh pr edit "${existing_pr_url}" \
              --title "chore: sync upstream ${UPSTREAM_REPO} ${UPSTREAM_BRANCH} into ${BASE_BRANCH}" \
              --body-file "${body_file}"
          else
            pr_url="$(
              gh pr create \
                --base "${BASE_BRANCH}" \
                --head "${SYNC_BRANCH}" \
                --title "chore: sync upstream ${UPSTREAM_REPO} ${UPSTREAM_BRANCH} into ${BASE_BRANCH}" \
                --body-file "${body_file}"
            )"
          fi

          echo "status=${sync_status}" >> "$GITHUB_OUTPUT"
          echo "pull_request_url=${pr_url}" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || steps.schedule.outputs.should_run == 'true') && steps.sync.outputs.behind != '' && steps.sync.outputs.behind != '0' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          SYNC_STATUS: ${{ steps.sync.outputs.status }}
          AHEAD: ${{ steps.sync.outputs.ahead }}
          BEHIND: ${{ steps.sync.outputs.behind }}
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          COMPARE_BRANCH: ${{ env.COMPARE_BRANCH }}
          SYNC_BRANCH: ${{ env.SYNC_BRANCH }}
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
          UPSTREAM_BRANCH: ${{ env.UPSTREAM_BRANCH }}
          PULL_REQUEST_URL: ${{ steps.sync.outputs.pull_request_url }}
          CONFLICT_FILES: ${{ steps.sync.outputs.conflict_files }}
        run: |
          set -euo pipefail

          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL is not configured; skipping Slack notification."
            exit 0
          fi

          if [ "${JOB_STATUS}" != "success" ]; then
            message="Upstream sync found ${BEHIND} commit(s) missing from ${GITHUB_REPOSITORY}/${COMPARE_BRANCH}, but the workflow failed. Check the run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          elif [ "${SYNC_STATUS}" = "created_with_conflicts_resolved_to_upstream_tree" ]; then
            message="Monthly upstream sync created/updated a PR for ${GITHUB_REPOSITORY}: ${PULL_REQUEST_URL}. ${COMPARE_BRANCH} is ${BEHIND} commit(s) behind ${UPSTREAM_REPO}/${UPSTREAM_BRANCH} and ${AHEAD} commit(s) ahead. The PR targets ${BASE_BRANCH} for staging review. Merge conflicts were detected and resolved to the upstream tree to keep the PR upstream-clean. Conflicted files: ${CONFLICT_FILES}. Review it, merge into ${BASE_BRANCH} with a merge commit, test staging, then promote ${BASE_BRANCH} to main."
          else
            message="Monthly upstream sync created/updated a PR for ${GITHUB_REPOSITORY}: ${PULL_REQUEST_URL}. ${COMPARE_BRANCH} is ${BEHIND} commit(s) behind ${UPSTREAM_REPO}/${UPSTREAM_BRANCH} and ${AHEAD} commit(s) ahead. The PR targets ${BASE_BRANCH} for staging review. No merge conflicts were detected. Review it, merge into ${BASE_BRANCH} with a merge commit, test staging, then promote ${BASE_BRANCH} to main. This workflow never auto-merges."
          fi

          jq -n --arg text "${message}" '{text: $text}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data-binary @- "${SLACK_WEBHOOK_URL}"
